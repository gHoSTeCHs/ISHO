<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/jpeg" href="/isho.jpg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Imo Self Help Organization (ISHO) is a Nigerian microfinance and capacity-building NGO. Since 1984 we have helped rural women and low-income families in South-East Nigeria build enterprises through small loans and kept books."
		/>
		<title>ISHO: Imo Self Help Organization · Four decades of small loans and steady books</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		<script>
			(function () {
				try {
					var saved = localStorage.getItem('isho-theme');
					if (saved) {
						document.documentElement.setAttribute('data-theme', saved);
					} else if (
						window.matchMedia &&
						window.matchMedia('(prefers-color-scheme: dark)').matches
					) {
						document.documentElement.setAttribute('data-theme', 'dark');
					} else {
						document.documentElement.setAttribute('data-theme', 'light');
					}
				} catch (e) {
					document.documentElement.setAttribute('data-theme', 'light');
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
